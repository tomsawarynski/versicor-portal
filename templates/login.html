{% extends 'base.html' %}
{% block title %}Sign in · Versicor Forecast Portal{% endblock %}
{% block content %}
<div style="max-width:420px; margin:60px auto;">
  <div class="card">
    <h1>Sign in</h1>
    <p class="muted">Enter your email and we'll send you a secure sign-in link.</p>
    <form method="post" action="{{ url_for('login') }}" style="margin-top:16px;">
      <input type="email" name="email" placeholder="you@company.com" required autofocus>
      <button type="submit" class="btn btn-primary" style="margin-top:12px; width:100%;">
        Send sign-in link
      </button>
    </form>
  </div>
  <p class="muted" style="text-align:center; margin-top:14px;">
    Versicor Precision Machining · authorized customers only
  </p>
</div>
{% endblock %}
