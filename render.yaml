services:
  - type: web
    name: versicor-portal
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SYNC_API_KEY
        generateValue: true        # copy this into the shop sync .env
      - key: PORTAL_BASE_URL
        sync: false                # set to your https://...onrender.com URL
      - key: RESEND_API_KEY
        sync: false                # paste from Resend dashboard
      - key: MAIL_FROM
        value: "Versicor Portal <portal@goversicor.com>"
      - key: WEEKS_AHEAD
        value: "12"
      - key: NOTIFY_EMAILS
        sync: false                # comma-separated recipients for submit alerts
      - key: DATABASE_URL
        fromDatabase:
          name: versicor-portal-db
          property: connectionString

databases:
  - name: versicor-portal-db
    plan: free
